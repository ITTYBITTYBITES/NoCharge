<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">NoCharge symbol</title>
  <desc id="desc">Four rounded tiles in a square grid with the bottom-left tile open as a doorway.</desc>
  <!--
    NoCharge primary symbol. Canonical construction (64 unit grid, pixel-aligned at 16 and 32 px):

    - Four rounded tiles (22 x 22, corner radius 6.5) in a 2 x 2 grid with 4-unit
      gutters, centred in a 64 x 64 viewBox: TL (8,8), TR (34,8), BL (8,34), BR (34,34).
    - The bottom-left tile is the doorway: an open rounded frame whose outer
      (bottom-left) corner is cut by an 8-unit gap on each edge. Three solid
      tiles form the arcade; the open corner is the entrance, so the mark reads
      "a quiet arcade you can walk into" without depicting money or payment.
    - Single-colour mark: uses currentColor, so it adapts to any background.
      Raster favicon and press versions use the documented palette (see
      docs/BRAND_GUIDE.md).

    No scripts, no external resources, no embedded raster. Hand-constructed.
  -->
  <g fill="currentColor">
    <rect x="8" y="8" width="22" height="22" rx="6.5"/>
    <rect x="34" y="8" width="22" height="22" rx="6.5"/>
    <rect x="34" y="34" width="22" height="22" rx="6.5"/>
  </g>
  <path fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" d="M14.5 34 H22.5 A6.5 6.5 0 0 1 30 40.5 V49.5 A6.5 6.5 0 0 1 22.5 56 H16 M8 48 V41.5 A6.5 6.5 0 0 1 14.5 34"/>
</svg>
