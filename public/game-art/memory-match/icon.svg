<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Memory Match icon</title>
  <desc id="desc">Two overlapping emerald cards with matching diamond symbols.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="84" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202923"/>
      <stop offset="1" stop-color="#111513"/>
    </linearGradient>
    <linearGradient id="card" x1="25" y1="18" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a3730"/>
      <stop offset="1" stop-color="#19201c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  <path d="M26 27h34a8 8 0 0 1 8 8v40a8 8 0 0 1-8 8H26a8 8 0 0 1-8-8V35a8 8 0 0 1 8-8Z" fill="#141916" stroke="#35473d" stroke-width="2"/>
  <path d="M39 13h34a8 8 0 0 1 8 8v40a8 8 0 0 1-8 8H39a8 8 0 0 1-8-8V21a8 8 0 0 1 8-8Z" fill="url(#card)" stroke="#12b66a" stroke-opacity=".62" stroke-width="2"/>
  <path d="m56 28 12 12-12 12-12-12 12-12Z" fill="none" stroke="#91e8ba" stroke-width="3" filter="url(#glow)"/>
  <path d="m31 47 8 8-8 8-8-8 8-8Z" fill="none" stroke="#12b66a" stroke-width="2" opacity=".8"/>
  <circle cx="75" cy="75" r="2" fill="#91e8ba"/>
</svg>
