<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NoCharge social sharing artwork</title>
  <desc id="desc">An opaque 1200 by 630 share image using editable SVG text for NoCharge and the homepage tagline, plus a large geometric brand tile. Its warm paper background is intentional for social preview services.</desc>
  <rect width="1200" height="630" fill="#f7f6ef"/>
  <rect x="88" y="92" width="48" height="8" rx="4" fill="#ff775d"/>
  <text x="88" y="216" fill="#20252b" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="94" letter-spacing="-6.2">
    <tspan font-weight="850">No</tspan><tspan font-weight="500">Charge</tspan>
  </text>
  <text x="92" y="330" fill="#424a52" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="49" font-weight="550" letter-spacing="-1.7">Play, explore,</text>
  <text x="92" y="393" fill="#626c33" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="49" font-weight="750" letter-spacing="-1.7">get things done.</text>
  <path d="M92 466h520" fill="none" stroke="#e4e1d8" stroke-width="2"/>
  <rect x="92" y="494" width="58" height="10" rx="5" fill="#d8f27c"/>
  <rect x="160" y="494" width="26" height="10" rx="5" fill="#ff775d"/>
  <rect x="196" y="494" width="26" height="10" rx="5" fill="#b9e6f1"/>
  <rect x="232" y="494" width="26" height="10" rx="5" fill="#d9cef7"/>
  <rect x="268" y="494" width="26" height="10" rx="5" fill="#f4d975"/>

  <rect x="736" y="92" width="376" height="420" rx="60" fill="#d8f27c"/>
  <rect x="814" y="169" width="220" height="220" rx="56" fill="#20252b"/>
  <path d="M852 352V206h28l108 112V206h28v146h-28L880 240v112Z" fill="#d8f27c"/>
