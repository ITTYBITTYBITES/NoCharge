<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-labelledby="nc04-r31-title nc04-r31-desc">
  <title id="nc04-r31-title">Tile puzzle category icon</title>
  <desc id="nc04-r31-desc">A compact sliding-tile board with one active tile and a small movement cue, reflecting the site's tile-puzzle games. Transparent canvas and no words. Theme behavior: neutral strokes inherit currentColor; green details use --nocharge-icon-accent; small recessed centers use --nocharge-icon-surface. The canvas remains transparent.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="5.2" height="5.2" rx="1.1"/>
    <rect x="9.4" y="3" width="5.2" height="5.2" rx="1.1" stroke="var(--nocharge-icon-accent, #0f7d47)"/>
    <rect x="15.8" y="3" width="5.2" height="5.2" rx="1.1"/>
    <rect x="3" y="9.4" width="5.2" height="5.2" rx="1.1"/>
    <rect x="9.4" y="9.4" width="5.2" height="5.2" rx="1.1"/>
    <rect x="15.8" y="9.4" width="5.2" height="5.2" rx="1.1"/>
    <rect x="3" y="15.8" width="5.2" height="5.2" rx="1.1"/>
    <rect x="9.4" y="15.8" width="5.2" height="5.2" rx="1.1"/>
    <path d="M16.4 18.4h3.7m-1.4-1.4 1.4 1.4-1.4 1.4" stroke="var(--nocharge-icon-accent, #0f7d47)"/>
  </g>
</svg>
