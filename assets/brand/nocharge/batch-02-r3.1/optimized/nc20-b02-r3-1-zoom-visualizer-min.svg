<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-labelledby="nc20-b02-title nc20-b02-desc"><title id="nc20-b02-title">Zoom Visualizer tool icon</title><desc id="nc20-b02-desc">A responsive viewport frame under a magnifying lens. Transparent 24 by 24 vector; neutral details inherit currentColor and the accent uses --nocharge-icon-accent, matching the adaptive NoCharge R3.1 section-icon treatment.</desc><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="13.3" height="12" rx="1.6"/><path d="M6 7h7M6 10h4M7 19h5M9.5 16v3"/><circle cx="17.5" cy="15.5" r="3.3" fill="var(--nocharge-icon-surface, #fffefa)"/><path d="m19.9 17.9 1.6 1.6"/><path d="M11.8 10h2.3M17.5 14v3" stroke="var(--nocharge-icon-accent, #0f7d47)"/><circle cx="17.5" cy="15.5" r=".8" fill="var(--nocharge-icon-accent, #0f7d47)" stroke="none"/></g></svg>