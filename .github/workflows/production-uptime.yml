name: Production uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uptime:
    runs-on: ubuntu-latest

    steps:
      - name: Check public V2 endpoints
        shell: bash
        env:
          SITE_URL: https://nocharge.net
        run: |
          set -euo pipefail
          for path in / /arcade/ /experiences/ /tools/ /guides/ /discover/ /setup/ /sitemap.xml /robots.txt /setup/feed.xml; do
            echo "Checking ${SITE_URL}${path}"
            curl --fail --location --silent --show-error --max-time 25 "${SITE_URL}${path}" >/dev/null
          done
