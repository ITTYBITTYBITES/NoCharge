name: Capture Beacon Lattice screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-beacon-screenshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-lattice-screenshots
          path: |
            public/game-art/beacon-lattice/screenshot-desktop.webp
            public/game-art/beacon-lattice/screenshot-mobile.webp
