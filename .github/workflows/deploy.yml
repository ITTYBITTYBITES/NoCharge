name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and Astro files
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Browser diagnostics
        run: |
          which google-chrome google-chrome-stable chromium chromium-browser || true
          google-chrome --version 2>/dev/null || google-chrome-stable --version 2>/dev/null || true
          npx playwright --version

      - name: Cache Playwright FFmpeg
        id: playwright-ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/ffmpeg-*
          key: playwright-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright FFmpeg
        if: steps.playwright-ffmpeg-cache.outputs.cache-hit != 'true'
        run: npx playwright install ffmpeg

      - name: Run browser and accessibility tests
        run: npx playwright test --project=chromium

      - name: Capture PR review screens
        if: github.event_name == 'pull_request'
        env:
          CAPTURE_PR: '1'
        run: npx playwright test tests/e2e/pr-captures.spec.ts --project=chromium

      - name: Upload PR visual captures
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-visual-captures
          path: artifacts/pr-captures/
          retention-days: 7

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
